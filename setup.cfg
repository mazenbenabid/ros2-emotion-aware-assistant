[develop]
script_dir=$base/lib/emotion_aware_assistant

[install]
install_scripts=$base/lib/emotion_aware_assistant

# Lets the installed nodes use the active Python (e.g. a virtual environment
# holding transformers/torch) instead of the hard-coded system interpreter.
[build_scripts]
executable = /usr/bin/env python3

[flake8]
max-line-length = 100
exclude = build,install,log,.venv
